name: Dependency test JAX

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  discover_jax_versions:
    if: ${{ github.event.label.name == 'test_jax' && github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      jax-versions: ${{ steps.discover.outputs.versions }}
    steps:
      - name: Discover available JAX versions from PyPI
        id: discover
        run: |
          # Fetch every stable, non-yanked JAX release >= 0.3.0 from PyPI and
          # emit them as a JSON array for the test matrix below. Missing
          # versions (e.g. 0.4.32) and any newly released versions are handled
          # automatically.
          versions=$(curl -s https://pypi.org/pypi/jax/json | jq -c \
            '[.releases | to_entries[]
              | select(.value | length > 0)
              | select(.value[0].yanked == false)
              | .key
              | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | select((split(".") | map(tonumber)) >= [0, 3, 0])]
             | sort_by(. | split(".") | map(tonumber))')
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  jax_tests:
    needs: discover_jax_versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jax-version: ${{ fromJSON(needs.discover_jax_versions.outputs.jax-versions) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies with given JAX version
        run: |
          pip install -e ".[test]"
          # override the jax pin from pyproject.toml with the version under test.
          # pip will warn about the resulting conflict with our declared range;
          # that is expected, since the point of this job is to probe old versions.
          pip install "jax == ${{ matrix.jax-version }}"
          pip list | grep -i "^jax"
      - name: Verify dependencies
        run: |
          python --version
          pip --version
          pip list
      - name: Test with pytest
        run: |
          pwd
          lscpu
          python -m pytest \
            --durations=0 \
            --maxfail=1 \

  report_jax_results:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: jax_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Summarize per-version results
        run: |
          # needs.jax_tests is an object keyed by each matrix combination (the
          # JAX version), with the result of that job. jax_tests uses
          # fail-fast: false, so every version is exercised even if some fail.
          echo '${{ toJSON(needs.jax_tests) }}' > results.json
          {
            echo '### JAX version test results'
            echo ''
            echo '| Version | Result |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then ":white_check_mark: passed" else ":x: failed" end) |"' results.json
            echo ''
            echo "Passed: $(jq '[to_entries[] | select(.value.result == "success")] | length' results.json), Failed: $(jq '[to_entries[] | select(.value.result != "success")] | length' results.json)"
          } > summary.md
          cat summary.md
      - name: Add comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
