name: Dependency test JAX

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  discover_jax_versions:
    if: >-
      ${{ github.event.label.name == 'test_jax' &&
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      jax-versions: ${{ steps.discover.outputs.versions }}
    steps:
      - name: Discover available JAX versions from PyPI
        id: discover
        run: |
          # Fetch every stable, non-yanked JAX release >= 0.4.18 from PyPI and
          # emit them as a JSON array for the test matrix below. Missing
          # versions (e.g. 0.4.32) and any newly released versions are handled
          # automatically. jaxlib only became pip-installable at 0.4.18, so
          # older jax cannot get a matching jaxlib here.
          versions=$(curl -s https://pypi.org/pypi/jax/json | jq -c \
            '[.releases | to_entries[]
              | select(.value | length > 0)
              | select(.value[0].yanked == false)
              | .key
              | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | select((split(".") | map(tonumber)) >= [0, 4, 18])]
             | sort_by(. | split(".") | map(tonumber))')
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  jax_tests:
    needs: discover_jax_versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jax-version: ${{ fromJSON(needs.discover_jax_versions.outputs.jax-versions) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies with given JAX version
        run: |
          pip install -e ".[test]"
          # override the jax pin from pyproject.toml with the version under test.
          # pip will warn about the resulting conflict with our declared range;
          # that is expected, since the point of this job is to probe old versions.
          # Start from a clean slate so the jaxlib already pulled in by `.[test]`
          # doesn't linger and get paired with an incompatible jax.
          pip uninstall -y jax jaxlib
          pip install "jax == ${{ matrix.jax-version }}"
          # jaxlib must match the jax version under test. For jax < 0.4.30,
          # jaxlib is not a base dependency of jax (it only exists in the [cpu]
          # extra), so a bare `pip install "jax == X"` would leave a mismatched
          # jaxlib behind. Pin the matching jaxlib, falling back to the [cpu]
          # extra for versions that only declare jaxlib there.
          pip install "jaxlib == ${{ matrix.jax-version }}" || \
            pip install "jax[cpu] == ${{ matrix.jax-version }}"
          pip list | grep -i "^jax"
      - name: Verify dependencies
        run: |
          python --version
          pip --version
          pip list
      - name: Test with pytest
        run: |
          pwd
          lscpu
          python -m pytest \
            --durations=0 \
            --maxfail=1 \

  report_jax_results:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: jax_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Summarize per-version results
        run: |
          # needs.jax_tests is an object keyed by each matrix combination (the
          # JAX version), with the result of that job. jax_tests uses
          # fail-fast: false, so every version is exercised even if some fail.
          # Note: GitHub serializes failed/skipped matrix jobs in the needs
          # context as a plain string (e.g. "failure") instead of an object,
          # so values must be checked for type before reading .result.
          echo '${{ toJSON(needs.jax_tests) }}' > results.json
          {
            echo '### JAX version test results'
            echo ''
            echo '| Version | Result |'
            echo '|---|---|'
            jq -r '
              if type != "object" then
                "| (no versions tested) | :x: failed |"
              else
                to_entries[] |
                "| \(.key) | \(
                  if
                    (.value | type) == "object"
                    and .value.result == "success"
                  then
                    ":white_check_mark: passed"
                  else
                    ":x: failed"
                  end
                ) |"
              end
            ' results.json
            echo ''
            passed=$(jq '
              [to_entries[] | select(
                (.value | type) == "object"
                and .value.result == "success"
              )] | length
            ' results.json)
            failed=$(jq '
              [to_entries[] | select(
                (.value | type) != "object"
                or .value.result != "success"
              )] | length
            ' results.json)
            echo "Passed: $passed, Failed: $failed"
          } > summary.md
          cat summary.md
      - name: Add comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
